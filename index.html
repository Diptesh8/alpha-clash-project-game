<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title class="">Document</title>
    <link rel="stylesheet" href="/style/style.css">
     <script src="https://cdn.tailwindcss.com"></script>
       <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
</head>
<body class="min-h-screen bg-[#010313] bg-[url('./images/background.png')] bg-no-repeat bg-center">
    <main class=>
        <!-- home  scren part-------- -->
        <section class="home min-h-screen text-white flex flex-col  items-center justify-center hidden">
            <div class="flex flex-col justify-center items-center gap-10">
             <h1 class="text-[170px] anton-regular uppercase">Alpha clash </h1>
              <p class="poppins-medium">Unleash Your Keyboard Kung Fu : Press “Enter” to Play</p>
              <button class="poppins-semibold btn bg-white text-black">Play Now</button> 
            </div>
    </section>
    <!-- playground part--------- -->
    <section class="playground">
        <div>
            <!-- screen -->
          <div class="w-[1024px] h-[320px] border-[20px] rounded-2xl border-[#010313cc] bg-[#FFFFFFb3]">
    1024x320
</div>
            <!-- keybord start-->
             <div>
                <div class="my-1 flex w-full justify-center gap-1">
  <kbd class="kbd">q</kbd>
  <kbd class="kbd">w</kbd>
  <kbd class="kbd">e</kbd>
  <kbd class="kbd">r</kbd>
  <kbd class="kbd">t</kbd>
  <kbd class="kbd">y</kbd>
  <kbd class="kbd">u</kbd>
  <kbd class="kbd">i</kbd>
  <kbd class="kbd">o</kbd>
  <kbd class="kbd">p</kbd>
</div>
<div class="my-1 flex w-full justify-center gap-1">
  <kbd class="kbd">a</kbd>
  <kbd class="kbd">s</kbd>
  <kbd class="kbd">d</kbd>
  <kbd class="kbd">f</kbd>
  <kbd class="kbd">g</kbd>
  <kbd class="kbd">h</kbd>
  <kbd class="kbd">j</kbd>
  <kbd class="kbd">k</kbd>
  <kbd class="kbd">l</kbd>
</div>
<div class="my-1 flex w-full justify-center gap-1">
  <kbd class="kbd">z</kbd>
  <kbd class="kbd">x</kbd>
  <kbd class="kbd">c</kbd>
  <kbd class="kbd">v</kbd>
  <kbd class="kbd">b</kbd>
  <kbd class="kbd">n</kbd>
  <kbd class="kbd">m</kbd>
  <kbd class="kbd">/</kbd>
</div>
             </div>
             <!-- keybord end -->
            <!-- life scored -->
             <div class="flex space">
                <button class="btn btn-active btn-warning text-white bg-[#894189] rounded-[30px] w-[160px] h-[56px]">Life 1</button>
                <button class="btn btn-active btn-warning text-white bg-[#360490] rounded-[30px] w-[160px] h-[56px]">score 1</button>

             </div>
        </div>

    </section>
    <!-- score part------------- -->
    <section class="score">
        
    </section>
    </main>
</body>
</html>
