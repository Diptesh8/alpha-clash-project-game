<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title class="">Document</title>
    <link rel="stylesheet" href="/style/style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
</head>

<body class="min-h-screen bg-[#010313] bg-[url('./images/background.png')] bg-no-repeat bg-center">
    <main class=>
        <!-- home  scren part-------- -->
        <section id="home-screen" class=" min-h-screen text-white flex flex-col  items-center justify-center ">
            <div class="flex flex-col justify-center items-center gap-10">
                <h1 class="text-[170px] anton-regular uppercase">Alpha clash </h1>
                <p class="poppins-medium">Unleash Your Keyboard Kung Fu : Press “Enter” to Play</p>
                <button onclick="play()"
                    class="poppins-semibold btn bg-white text-black w-[175px] h-[73px] font-semibold text-2xl">Play
                    Now</button>
            </div>
        </section>
        <!-- playground part--------- -->
        <section id="playground" class=" hidden">
            <div class="flex justify-center flex-col items-center gap-20 pt-20">
                <!-- screen -->
                <div class="w-[1024px] h-[320px] border-[20px] rounded-2xl border-[#010313cc] bg-[#FFFFFFb3]">
                    <div class="flex justify-center">
                        <p class="bg-[#2F2941] text-white rounded-bl-[12px] rounded-br-[12px] px-6 pb-4">Don't watch
                            keyboard while playing...</p>
                    </div>
                    <div class="flex justify-center items-center">
                        <p id="current-alphabet" class="text-black text-9xl font-bold h-full">Y</p>
                    </div>
                </div>
                <!-- keybord start-->
                <div class="w-[684px] h-[193px]">
                    <div class="my-1 flex w-full justify-center gap-1">
                        <kbd id="q" class="kbd">q</kbd>
                        <kbd id="w" class="kbd">w</kbd>
                        <kbd id="e" class="kbd">e</kbd>
                        <kbd id="r" class="kbd">r</kbd>
                        <kbd id="t" class="kbd">t</kbd>
                        <kbd id="y" class="kbd">y</kbd>
                        <kbd id="u" class="kbd">u</kbd>
                        <kbd id="i" class="kbd">i</kbd>
                        <kbd id="o" class="kbd">o</kbd>
                        <kbd id="p" class="kbd">p</kbd>
                    </div>
                    <div class="my-1 flex w-full justify-center gap-1">
                        <kbd id="a" class="kbd">a</kbd>
                        <kbd id="s" class="kbd">s</kbd>
                        <kbd id="d" class="kbd">d</kbd>
                        <kbd id="f" class="kbd">f</kbd>
                        <kbd id="g" class="kbd">g</kbd>
                        <kbd id="h" class="kbd">h</kbd>
                        <kbd id="j" class="kbd">j</kbd>
                        <kbd id="k" class="kbd">k</kbd>
                        <kbd id="l" class="kbd">l</kbd>
                    </div>
                    <div class="my-1 flex w-full justify-center gap-1">
                        <kbd id="z" class="kbd">z</kbd>
                        <kbd id="x" class="kbd">x</kbd>
                        <kbd id="c" class="kbd">c</kbd>
                        <kbd id="v" class="kbd">v</kbd>
                        <kbd id="b" class="kbd">b</kbd>
                        <kbd id="n" class="kbd">n</kbd>
                        <kbd id="m" class="kbd">m</kbd>
                        <kbd id="/" class="kbd">/</kbd>
                    </div>
                </div>
                <!-- keybord end -->
                <!-- life scored -->
                <div class="flex justify-between w-3/4">
                    <button
                        class="btn btn-active btn-warning text-white bg-[#894189] rounded-[30px] w-[160px] h-[56px]">Life
                        <img src="./images/heart.svg">
                        1</button>
                    <button
                        class="btn btn-active btn-warning text-white bg-[#360490] rounded-[30px] w-[160px] h-[56px]">score
                        <img src="./images/doller.svg"> 1</button>

                </div>
            </div>

        </section>
        <!-- score part------------- -->
        <section class="score hidden">
            <div class="text-white flex flex-col justify-center items-center min-h-screen gap-4">
                <h1 class="text-8xl"><span class="font-extrabold">Score :</span> <span>14</span></h1>
                <button
                    class="btn btn-active btn-secondary font-semibold text-2xl bg-white text-black p-0.5 w-[175px] h-[65px]">Play
                    Again</button>
                <p>Practice will make you Pro</p>

            </div>

        </section>
    </main>
    <script src="/scripts/uyility.js"></script>
    <script src="/scripts/alpha-clash.js"></script>
</body>

</html>
